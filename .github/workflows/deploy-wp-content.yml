name: Deploy WordPress Theme Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that stores deploy secrets
        required: true
        type: choice
        default: production
        options:
          - staging
          - production
      deploy_plugins:
        description: Also deploy managed custom plugins from the repository
        required: true
        type: boolean
        default: false

env:
  THEME_SLUG: a4-remont
  THEME_DIR: wp-content/themes/a4-remont
  PLUGINS_DIR: wp-content/plugins

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          required=(DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_PATH)
          for variable in "${required[@]}"; do
            if [ -z "${!variable}" ]; then
              echo "::error::${variable} is not configured for the selected environment."
              exit 1
            fi
          done

      - name: Deploy theme
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          LOCAL_THEME_PATH="${GITHUB_WORKSPACE}/${THEME_DIR}"
          REMOTE_THEME_PATH="${DEPLOY_PATH%/}/wp-content/themes/${THEME_SLUG}"
          lftp -u "${DEPLOY_USER}","${DEPLOY_PASSWORD}" -p "${DEPLOY_PORT:-21}" "${DEPLOY_HOST}" -e "
          set cmd:fail-exit yes;
          set ftp:ssl-allow no;
          set net:max-retries 2;
          set net:timeout 20;
          mkdir -p ${REMOTE_THEME_PATH};
          lcd ${LOCAL_THEME_PATH};
          mirror -R --delete --verbose --exclude-glob .gitkeep . ${REMOTE_THEME_PATH};
          bye
          "

      - name: Deploy managed plugins
        if: ${{ inputs.deploy_plugins }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          shopt -s nullglob
          plugin_dirs=("${PLUGINS_DIR}"/*/)

          if [ "${#plugin_dirs[@]}" -eq 0 ]; then
            echo "No managed plugin directories found."
            exit 0
          fi

          for plugin_dir in "${plugin_dirs[@]}"; do
            plugin_name="$(basename "${plugin_dir}")"
            local_plugin_path="${GITHUB_WORKSPACE}/${plugin_dir%/}"
            remote_plugin_path="${DEPLOY_PATH%/}/wp-content/plugins/${plugin_name}"

            lftp -u "${DEPLOY_USER}","${DEPLOY_PASSWORD}" -p "${DEPLOY_PORT:-21}" "${DEPLOY_HOST}" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-allow no;
            set net:max-retries 2;
            set net:timeout 20;
            mkdir -p ${remote_plugin_path};
            lcd ${local_plugin_path};
            mirror -R --delete --verbose --exclude-glob .gitkeep . ${remote_plugin_path};
            bye
            "
          done
