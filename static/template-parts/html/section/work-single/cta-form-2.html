
<section class="cta-form">
  <div class="cta-form__container _container">
    <div class="cta-form__grid">
      <div class="cta-form__left">
        <h2 class="section__title cta-form__title">Хотите себе такой же ремонт?</h2>
        <p class="section__subtitle cta-form__lead">
          Оставьте свои контактные данные и мы свяжемся
          с вами для обсуждения вашего проекта.
        </p>
      </div>
      <div class="cta-form__right">
        <form class="cta-form__form" action="#" method="post">
          <div class="cta-form__row">
            <label class="cta-form__field"><span class="visually-hidden">Ваше имя</span>
              <input class="cta-form__input" type="text" name="name" placeholder="Ваше имя" autocomplete="name"/>
            </label>
            <label class="cta-form__field"><span class="visually-hidden">Телефон</span>
              <input class="cta-form__input" type="tel" name="phone" placeholder="+7 000 000 00 00" inputmode="tel" autocomplete="tel"/>
            </label>
          </div>
          <label class="cta-form__field"><span class="visually-hidden">E-mail</span>
            <input class="cta-form__input" type="email" name="email" placeholder="E-mail" autocomplete="email"/>
          </label>
          <label class="cta-form__field"><span class="visually-hidden">Сообщение</span>
            <textarea class="cta-form__textarea" name="message" rows="6" placeholder="Сообщение"></textarea>
          </label>
          <label class="cta-form__agree">
            <input class="cta-form__checkbox" type="checkbox" name="agree" checked="checked"/><span class="cta-form__agree-ui" aria-hidden="true"></span><span class="cta-form__agree-text">Я даю согласие на <a href="#">обработку персональных данных</a> и соглашаюсь
              с <a href="#">политикой конфиденциальности</a></span>
          </label>
          <div class="cta-form__actions">
            <button class="btn btn--grey cta-form__submit" type="submit">Отправить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
